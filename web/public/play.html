<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1A20">
<title>FLUJO LIBRE — tu control</title>
<style>
:root{--paper:#F4EBD9;--card:#FFFDF6;--ink:#17252E;--ink2:#43555F;--line:#DCD3C0;
  --peq:#2E6E6B;--grande:#C2452D;--mercado:#D99A1F;--gusto:#7A4E6E;--cobrar:#3F7A4A;--banco:#44586B;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#0E1A20;color:var(--ink);font-family:'Segoe UI',system-ui,sans-serif;
  min-height:100dvh;display:flex;justify-content:center}
.app{width:100%;max-width:460px;display:flex;flex-direction:column;gap:10px;padding:12px 12px 24px}

/* join */
.join{background:var(--paper);border-radius:18px;padding:26px 22px;margin-top:12vh;text-align:center}
.join h1{font-family:Georgia,serif;font-size:34px;line-height:.95;letter-spacing:-.01em}
.join h1 em{font-style:normal;color:#C2452D}
.join p{font-size:14px;color:var(--ink2);margin:12px 0 20px;line-height:1.4}
.join input{width:100%;padding:15px 16px;border-radius:12px;border:1.5px solid var(--ink);
  font-size:16px;background:#fff;font-family:inherit}
.join button{margin-top:12px;width:100%;padding:16px;border-radius:12px;border:0;
  background:var(--ink);color:#fff;font-size:16px;font-weight:700;letter-spacing:.02em}
.join small{display:block;margin-top:14px;font-size:11px;color:#7d8f98;letter-spacing:.14em;text-transform:uppercase}

/* header */
header{display:flex;align-items:center;gap:10px;color:var(--paper);padding:4px 4px 2px}
header .dot{width:14px;height:14px;border-radius:50%}
header b{font-family:Georgia,serif;font-size:17px}
header .right{margin-left:auto;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8fa3ab}

.card{background:var(--card);border-radius:16px;padding:16px;border:1px solid rgba(23,37,46,.12)}
.card.tight{padding:12px 14px}

.money{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.money .box{background:var(--paper);border-radius:12px;padding:10px 12px}
.money .k{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#7d8f98}
.money .v{font-family:Georgia,serif;font-size:22px;font-weight:700;margin-top:2px;
  font-variant-numeric:tabular-nums;line-height:1.1}
.money .v.small{font-size:18px}
.barWrap{margin-top:12px}
.barTop{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink2);letter-spacing:.05em}
.bar{height:10px;border-radius:6px;background:#E7DECB;overflow:hidden;margin-top:5px;border:1px solid #cfc3a9}
.bar i{display:block;height:100%;background:var(--cobrar);transition:width .4s}

.turnBanner{background:linear-gradient(90deg,#C2452D,#a83a25);color:#fff;border-radius:14px;
  padding:12px 16px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;
  letter-spacing:.02em}
.turnBanner.wait{background:rgba(255,255,255,.06);color:#9fb2ba;font-weight:600}
.turnBanner .n{font-family:Georgia,serif;font-size:20px}

.action h2{font-family:Georgia,serif;font-size:20px;line-height:1.15;margin:2px 0 4px}
.tagline{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#7d8f98;margin-bottom:8px}
.amount{font-family:Georgia,serif;font-size:38px;font-weight:700;line-height:1;margin:6px 0 10px;
  font-variant-numeric:tabular-nums}
.rows{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink2);margin-bottom:6px}
.rows b{color:var(--ink)}
.note{font-size:12px;font-style:italic;color:#5c6f78;line-height:1.35;margin-top:6px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.btn{border:0;border-radius:12px;padding:15px 12px;font-size:15px;font-weight:700;font-family:inherit;
  background:var(--ink);color:#fff;letter-spacing:.02em}
.btn.primary{background:#C2452D}
.btn.green{background:var(--cobrar)}
.btn.ghost{background:transparent;border:1.5px solid #c9bfa8;color:var(--ink)}
.btn:disabled{opacity:.35}
.btn.wide{grid-column:1/-1}
.btn.big{padding:20px;font-size:18px}

.asset{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.asset:last-child{border-bottom:0}
.asset .info{flex:1;min-width:0}
.asset .info b{display:block;font-size:13.5px;font-weight:600;line-height:1.2}
.asset .info span{font-size:11px;color:#7d8f98}
.asset .val{text-align:right;font-variant-numeric:tabular-nums;font-size:13px;font-weight:700}
.asset button{padding:9px 12px;border-radius:9px;border:1.5px solid var(--ink);background:transparent;
  font-size:12px;font-weight:700;font-family:inherit}

.log{max-height:150px;overflow:auto;font-size:12px;color:#5c6f78;line-height:1.45}
.log div{padding:4px 0;border-bottom:1px dashed #E5DCC8}

h3.sect{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#8fa3ab;margin:6px 4px 0;
  color:#7d8f98}
summary{cursor:pointer;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#7d8f98;
  padding:6px 2px;list-style:none}
summary::-webkit-details-marker{display:none}
details[open] summary{margin-bottom:6px}

.win{position:fixed;inset:0;background:rgba(14,26,32,.94);display:flex;align-items:center;
  justify-content:center;padding:24px;z-index:50;text-align:center;color:var(--paper)}
.win .in{max-width:340px}
.win h2{font-family:Georgia,serif;font-size:34px;line-height:1;margin-bottom:12px}
.win p{color:#a9bcc4;font-size:14px;line-height:1.5}

.err{background:#C2452D;color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;text-align:center}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
const $app = document.getElementById('app');
const store = {
  get(){ try{ return JSON.parse(localStorage.getItem('flujo')||'null'); }catch(e){ return null; } },
  set(v){ localStorage.setItem('flujo', JSON.stringify(v)); },
  clear(){ localStorage.removeItem('flujo'); }
};
let ME = store.get();
// reconexión: /p?id=...&token=...
(() => {
  const q = new URLSearchParams(location.search);
  if (q.get('id') && q.get('token')) {
    ME = { id: q.get('id'), token: q.get('token'), name: q.get('name') || 'Jugador' };
    store.set(ME);
    history.replaceState(null, '', '/p');
  }
})();
let S = null;
let lastSig = '';

const fmt = n => '$' + Math.round(n||0).toLocaleString('es-CO');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------------- join ---------------- */
function renderJoin(msg){
  $app.innerHTML = `
    <div class="join">
      <h1>FLUJO<br><em>LIBRE</em></h1>
      <p>El juego de la libertad financiera.<br>Escribe tu nombre para entrar a la mesa.</p>
      <input id="nm" maxlength="14" placeholder="Tu nombre" autocomplete="off">
      <button id="go">Entrar</button>
      ${msg ? `<div class="err" style="margin-top:12px">${esc(msg)}</div>` : ''}
      <small>Necesitas estar en la misma Wi-Fi</small>
    </div>`;
  const go = async () => {
    const name = document.getElementById('nm').value.trim();
    if (!name) return document.getElementById('nm').focus();
    const r = await fetch('/api/join', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({name})});
    const d = await r.json();
    if (d.error) return renderJoin(d.error);
    ME = {id: d.playerId, token: d.token, name};
    store.set(ME);
    boot();
  };
  document.getElementById('go').onclick = go;
  document.getElementById('nm').onkeydown = e => { if (e.key === 'Enter') go(); };
}

/* ---------------- acciones ---------------- */
async function send(type, payload){
  if (!ME) return;
  const r = await fetch('/api/action', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({playerId: ME.id, token: ME.token, type, payload})});
  const d = await r.json();
  if (d.error) flash(d.error);
}
function flash(msg){
  const el = document.createElement('div');
  el.className = 'err';
  el.textContent = msg;
  el.style.cssText += 'position:fixed;left:12px;right:12px;bottom:16px;z-index:80';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2400);
}

/* ---------------- render ---------------- */
function myIndex(st){ return st.players.findIndex(p => p.id === ME.id); }

function render(){
  if (!S) return;
  const i = myIndex(S);
  if (i < 0) { renderJoin('Tu sesión terminó. Vuelve a entrar.'); return; }
  const p = S.players[i];
  const myTurn = S.phase === 'playing' && S.turn === i;
  const pct = p.expenses ? Math.min(100, Math.round(p.passive / p.expenses * 100)) : 0;

  let action = '';
  if (S.phase === 'lobby') {
    action = `<div class="card"><div class="tagline">Sala de espera</div>
      <h2>Ya estás en la mesa</h2>
      <div class="note">Espera a que el anfitrión empiece. Cuando arranque verás aquí tu profesión,
      tu sueldo y tus gastos.</div>
      <div class="rows" style="margin-top:12px"><span>${S.players.length} de 6 jugadores</span></div></div>`;
  } else if (S.phase === 'over') {
    const w = S.players.find(x => x.id === S.winner);
    action = `<div class="card"><div class="tagline">Fin de la partida</div>
      <h2>${w ? esc(w.name) + ' compró su sueño' : 'Partida terminada'}</h2>
      <div class="note">${esc(S.message)}</div></div>`;
  } else if (!myTurn) {
    action = `<div class="turnBanner wait"><span>Turno de</span><span class="n">${esc(S.turnPlayer||'—')}</span></div>
      <div class="card"><div class="tagline">En tu móvil</div>
      <h2>Observa y planea</h2>
      <div class="note">${esc(S.message)}</div></div>`;
  } else {
    action = renderTurn(p);
  }

  $app.innerHTML = `
    <header>
      <div class="dot" style="background:${p.color}"></div>
      <b>${esc(p.name)}</b>
      <span class="right">${p.escaped ? 'Vía rápida' : 'Ratonera'} · R${S.round}</span>
    </header>

    ${myTurn && S.phase==='playing' ? '' : ''}

    <div class="card tight">
      <div class="money">
        <div class="box"><div class="k">Efectivo</div><div class="v">${fmt(p.cash)}</div></div>
        <div class="box"><div class="k">Flujo / mes</div><div class="v small">${fmt(p.flow)}</div></div>
      </div>
      <div class="barWrap">
        <div class="barTop"><span>Rentas ${fmt(p.passive)}</span><span>Gastos ${fmt(p.expenses)}</span></div>
        <div class="bar"><i style="width:${pct}%"></i></div>
      </div>
    </div>

    ${action}

    <details class="card tight">
      <summary>Mis activos (${p.assets.length}) · deudas (${p.debts.length})</summary>
      ${p.assets.length ? p.assets.map(a => `
        <div class="asset"><div class="info"><b>${esc(a.name)}</b>
          <span>${esc(a.tag)} · pagaste ${fmt(a.down)}</span></div>
          <div class="val">+${fmt(a.flow)}</div></div>`).join('')
        : '<div class="note">Todavía no tienes activos que te paguen. Esa es la misión.</div>'}
      ${p.debts.length ? '<div class="tagline" style="margin-top:14px">Deudas</div>' +
        p.debts.map(d => `<div class="asset"><div class="info"><b>Saldo ${fmt(d.balance)}</b>
          <span>pago ${fmt(d.payment)}/mes</span></div>
          <button data-repay="${d.id}">Pagar</button></div>`).join('') : ''}
    </details>

    <details class="card tight">
      <summary>Banco y ayuda</summary>
      <div class="btns" style="grid-template-columns:1fr 1fr">
        <button class="btn ghost" data-loan="50000">Préstamo 50k</button>
        <button class="btn ghost" data-loan="100000">Préstamo 100k</button>
      </div>
      <div class="note" style="margin-top:10px">Cada 10.000 prestados suman 1.000 a tus gastos
      mensuales. Máximo 10 veces tu salario (${fmt(p.salary*10)}).</div>
    </details>

    <details class="card tight">
      <summary>Lo que pasa</summary>
      <div class="log">${S.log.slice(0,14).map(l => `<div>${esc(l.text)}</div>`).join('')}</div>
    </details>
  `;

  bind(p);
}

function renderTurn(p){
  const pend = S.pending;

  if (pend && pend.type === 'deal') {
    const c = pend.card;
    const can = p.cash + Math.max(0, p.salary*10) >= c.down;
    return `<div class="card action">
      <div class="tagline">${pend.deck === 'big' ? 'Oportunidad grande' : 'Oportunidad pequeña'}</div>
      <h2>${esc(c.name)}</h2>
      <div class="amount">${fmt(c.down)}</div>
      <div class="rows">
        <span>Costo <b>${fmt(c.cost)}</b></span>
        <span>Flujo <b>+${fmt(c.flow)}/mes</b></span>
        ${pend.deck === 'big' ? `<span>Deuda <b>${fmt(c.cost - c.down)}</b></span>` : ''}
      </div>
      <div class="note">${esc(c.note)}</div>
      <div class="btns">
        <button class="btn ghost" data-act="pass">Pasar</button>
        <button class="btn primary" data-act="buy" ${can?'':'disabled'}>Comprar</button>
      </div>
      ${can?'':'<div class="note">No te alcanza ni con préstamo máximo.</div>'}
    </div>`;
  }

  if (pend && pend.type === 'sell') {
    const opts = p.assets.filter(a => pend.options.includes(a.id));
    return `<div class="card action">
      <div class="tagline">Mercado</div>
      <h2>${esc(pend.card.name)}</h2>
      <div class="note">${esc(pend.card.text)}</div>
      ${opts.map(a => `<div class="asset"><div class="info"><b>${esc(a.name)}</b>
        <span>costo ${fmt(a.cost)} · venta ${fmt(a.cost*pend.mult)}</span></div>
        <button data-choose="${a.id}">Vender</button></div>`).join('')}
      <div class="btns"><button class="btn ghost wide" data-act="pass">${pend.optional?'Mantener':'No vender'}</button></div>
    </div>`;
  }

  if (pend && pend.type === 'rent') {
    const opts = p.assets.filter(a => pend.options.includes(a.id));
    return `<div class="card action">
      <div class="tagline">Mercado</div>
      <h2>${esc(pend.card.name)}</h2>
      <div class="note">Elige la propiedad que sube ${pend.pct}% de renta.</div>
      ${opts.map(a => `<div class="asset"><div class="info"><b>${esc(a.name)}</b>
        <span>renta actual ${fmt(a.flow)}</span></div>
        <button data-choose="${a.id}">Subir</button></div>`).join('')}
      <div class="btns"><button class="btn ghost wide" data-act="pass">Ahora no</button></div>
    </div>`;
  }

  if (pend && pend.type === 'dream') {
    const c = pend.card;
    const can = p.cash >= c.cost;
    return `<div class="card action">
      <div class="tagline">Vía rápida · sueño</div>
      <h2>${esc(c.name)}</h2>
      <div class="amount">${fmt(c.cost)}</div>
      <div class="note">Si lo compras, ganas la partida. Tienes ${fmt(p.cash)}.</div>
      <div class="btns">
        <button class="btn ghost" data-act="pass">Ahorrar más</button>
        <button class="btn green" data-act="dream" ${can?'':'disabled'}>Comprar y ganar</button>
      </div>
    </div>`;
  }

  if (pend && pend.type === 'bank') {
    const don = Math.round(p.salary * 0.1);
    return `<div class="card action">
      <div class="tagline">Banco / Caridad</div>
      <h2>Elige una opción</h2>
      <div class="note">Un préstamo acelera, pero sube tus gastos. Donar el 10% te da dos dados
      durante tres turnos.</div>
      <div class="btns" style="grid-template-columns:1fr">
        <button class="btn ghost" data-loan="100000">Pedir préstamo de 100.000</button>
        <button class="btn ghost" data-donate="1">Donar ${fmt(don)} (10%)</button>
        <button class="btn ghost" data-act="pass">Pasar de largo</button>
      </div>
    </div>`;
  }

  if (!S.dice) {
    return `<div class="turnBanner"><span>Es tu turno</span><span class="n">${esc(p.name)}</span></div>
      <div class="card action">
        <div class="tagline">Paso 1</div>
        <h2>Tira el dado</h2>
        <div class="note">${esc(S.message)}</div>
        <div class="btns"><button class="btn primary big wide" data-act="roll">Tirar el dado</button></div>
      </div>`;
  }

  const card = S.lastCard;
  if (card) {
    const label = {small:'Oportunidad pequeña', big:'Oportunidad grande', market:'Mercado',
      gusto:'Gusto', dream:'Sueño'}[card.kind] || 'Carta';
    const amount = card.kind === 'dream' ? card.cost
      : card.kind === 'gusto' ? Math.abs(card.amount)
      : (card.down || 0);
    return `<div class="card action">
      <div class="tagline">${label}</div>
      <h2>${esc(card.name)}</h2>
      ${card.kind === 'market' ? '' : `<div class="amount">${fmt(amount)}</div>`}
      <div class="note">${esc(S.message)}</div>
      <div class="btns"><button class="btn wide" data-act="end">Terminar turno</button></div>
    </div>`;
  }

  return `<div class="card action">
      <div class="tagline">Turno resuelto</div>
      <h2>${esc(S.message)}</h2>
      <div class="note">Revisa tu hoja, actualiza tus cuentas y pasa el dado.</div>
      <div class="btns"><button class="btn wide" data-act="end">Terminar turno</button></div>
    </div>`;
}

function bind(p){
  $app.querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
    b.disabled = true;
    send(b.dataset.act);
    setTimeout(()=>{ b.disabled = false; }, 1200);
  });
  $app.querySelectorAll('[data-choose]').forEach(b => b.onclick = () => {
    send('choose', {assetId: b.dataset.choose}); });
  $app.querySelectorAll('[data-repay]').forEach(b => b.onclick = () => {
    send('repay', {debtId: b.dataset.repay}); });
  $app.querySelectorAll('[data-loan]').forEach(b => b.onclick = () => {
    send('loan', {amount: Number(b.dataset.loan)}); });
  $app.querySelectorAll('[data-donate]').forEach(b => b.onclick = () => send('donate'));
}

/* ---------------- sync ---------------- */
function sig(st){
  return JSON.stringify([st.turn, st.phase, st.dice, st.pending, st.lastCard,
    st.players.map(x=>[x.id,x.cash,x.passive,x.expenses,x.assets.length,x.pos,x.vpos]),
    st.log[0]&&st.log[0].id, st.message]);
}

function boot(){
  if (!ME) return renderJoin();
  const ev = new EventSource('/events');
  ev.onmessage = (e) => {
    S = JSON.parse(e.data);
    if (myIndex(S) < 0 && S.phase !== 'lobby') { ev.close(); store.clear(); ME=null; return renderJoin('La partida ya había empezado. Pide que reinicien.'); }
    const s = sig(S);
    if (s !== lastSig) { lastSig = s; render(); }
  };
  ev.onerror = () => {};
  fetch('/api/state').then(r=>r.json()).then(st => { S = st; render(); });
}

boot();
</script>
</body>
</html>
